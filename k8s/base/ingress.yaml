apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loja-veloz-ingress
  namespace: loja-veloz
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: loja-veloz.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
